name: Build Kernel Resukisu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex g++-multilib gcc-multilib clang lld llvm libssl-dev libxml2-utils make zlib1g-dev libncurses5-dev
          # Menambahkan Clang yang lebih baru jika diperlukan
          sudo apt-get install -y clang-14

      - name: Patch Resukisu (KernelSU + Susfs)
        run: |
          # Mengambil source KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          
          # Patching tambahan untuk Susfs (Resukisu)
          # Sesuaikan URL/branch jika ada perubahan dari pengembang Resukisu
          cd KernelSU
          git remote add ksu-susfs https://github.com/sidex15/ksu_module_susfs.git
          git fetch ksu-susfs
          git checkout -b susfs-main ksu-susfs/main
          cd ..
          
          # Pastikan susfs terintegrasi ke kernel tree
          # (Beberapa source memerlukan perintah tambahan tergantung implementasi)

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make O=out cepheus_defconfig
          
          # Tambahkan opsi tambahan jika perlu (misal: CONFIG_KSU=y)
          make -j$(nproc) O=out

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Resukisu-Cepheus
          path: out/arch/arm64/boot/Image.gz-dtb
